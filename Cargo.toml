[package]
name = "name_cluster"
version = "0.1.2"
edition = "2021"
description = "Cluster business names into entity groups"
license = "MIT"

[lib]
name = "name_cluster"
crate-type = ["cdylib", "rlib"]

[features]
# abi3 (stable ABI) wheels cover every GIL build from 3.12 up, so one wheel
# per platform serves 3.12/3.13/3.14/... Free-threaded builds must NOT enable
# it: the free-threaded stable ABI (`abi3t`) only starts at 3.15, so 3.13t and
# 3.14t need one version-specific wheel each, built without this feature.
abi3 = ["pyo3/abi3-py312"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
unicode-normalization = "0.1"
ahash = "0.8"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"

[dev-dependencies]
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
