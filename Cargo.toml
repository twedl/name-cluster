[package]
name = "name_cluster"
version = "0.1.0"
edition = "2021"
description = "Cluster business names into entity groups"
license = "MIT"

[lib]
name = "name_cluster"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py312", "extension-module"] }
unicode-normalization = "0.1"
ahash = "0.8"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"

[dev-dependencies]
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
