name: publish

# Build Linux manylinux wheels (x86_64 + aarch64) and publish to PyPI.
# Triggers:
#   - push of a tag matching v* (e.g. v0.1.1)
#   - manual workflow_dispatch
#
# Required repository secret:
#   PYPI_API_TOKEN — a PyPI API token scoped to this project (or account-wide
#                    if no project upload yet). Set under Settings → Secrets.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: build linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --strip --out dist
          manylinux: auto
          # qemu emulation handles aarch64 cross-build on x86_64 runners
          before-script-linux: |
            echo "building for ${{ matrix.target }}"

      - name: upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  publish:
    name: publish to pypi
    needs: [build]
    runs-on: ubuntu-latest
    # Only run on tag push or explicit dispatch — not on every artifact build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write  # required for trusted publishing if MATURIN_PYPI_TOKEN is empty
    environment:
      name: pypi
      url: https://pypi.org/p/name-cluster
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list wheels
        run: ls -lh dist/

      - name: publish to pypi
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --skip-existing dist/*
